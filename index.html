<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Field Report</title>
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="app" class="app"></div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="gal" type="file" accept="image/*" multiple hidden>
<input id="spotCam" type="file" accept="image/*" capture="environment" hidden>
<input id="shCam" type="file" accept="image/*" capture="environment" hidden>
<input id="spotVid" type="file" accept="video/*" capture="environment" hidden>
<input id="repVid" type="file" accept="video/*" capture="environment" hidden>
<input id="repVidGal" type="file" accept="video/*" hidden>
<input id="spotGal" type="file" accept="image/*,video/*" multiple hidden>
<input id="cdPic" type="file" accept="image/*" hidden>
<input id="rcpt" type="file" accept="image/*" hidden>
<input id="smCam" type="file" accept="image/*" capture="environment" hidden>
<noscript>Field Report needs JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
